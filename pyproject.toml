[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n8n-local-sync"
version = "0.1.0"
description = "A CLI tool to version, validate, export, import, and sync workflows from self-hosted n8n instances using Git."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "DanielDPereira" }
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "deepdiff>=6.7.1",
    "tenacity>=8.2.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "build>=1.0.3"
]

[project.scripts]
n8n-sync = "n8n_local_sync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_local_sync"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "SIM102"]
